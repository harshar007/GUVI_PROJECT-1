services:
  # Streamlit Analytics Platform Service connected to Host Machine MySQL Database
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cart2insights_web
    restart: unless-stopped
    ports:
      - "8502:8501"
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: cart2insights_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
